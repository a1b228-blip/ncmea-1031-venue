<style>
  :root {
    --bg: #0f172a;
    --panel: rgba(15, 23, 42, 0.88);
    --panel-border: rgba(148, 163, 184, 0.24);
    --text: #f8fafc;
    --sub: #cbd5e1;
    --accent: #ef4444;
    --gold: #fbbf24;
    --ok: #22c55e;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; width: 100%; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: "PingFang TC", "Heiti TC", "Microsoft JhengHei", sans-serif;
    overflow: hidden; user-select: none;
  }
  #canvas-wrap { position: absolute; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }

  /* 頂部導覽與控制列 */
  header.topbar {
    position: absolute; top: 12px; left: 14px; right: 14px; z-index: 20;
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
    background: var(--panel); backdrop-filter: blur(12px);
    border: 1px solid var(--panel-border);
    border-radius: 16px; padding: 9px 14px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.38);
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; min-width: 240px; }
  .brand .badge {
    background: linear-gradient(135deg, #dc2626, #991b1b);
    color: #fff; font-weight: 800; font-size: 14px;
    padding: 4px 11px; border-radius: 999px; white-space: nowrap;
    box-shadow: 0 2px 8px rgba(220, 38, 38, 0.45);
  }
  .brand h1 { margin: 0; font-size: clamp(15px, 1.35vw, 20px); font-weight: 800; color: #fff; }
  .brand small { display: block; color: var(--sub); font-size: 12px; margin-top: 1px; }

  .pill-group {
    display: inline-flex; flex-wrap: wrap; background: rgba(30, 41, 59, 0.92);
    border: 1px solid rgba(148, 163, 184, 0.22);
    border-radius: 10px; padding: 3px; gap: 3px;
  }
  .pill-group button, .btn-top {
    border: 0; background: transparent; color: var(--sub);
    font: inherit; font-size: 13.5px; font-weight: 700;
    padding: 5px 10px; border-radius: 7px; cursor: pointer;
    transition: all 0.16s ease; white-space: nowrap;
  }
  .pill-group button:hover, .btn-top:hover { color: #fff; background: rgba(255, 255, 255, 0.08); }
  .pill-group button.on {
    background: #2563eb; color: #fff;
    box-shadow: 0 2px 8px rgba(37, 99, 235, 0.45);
  }
  #sceneGroup button.on {
    background: linear-gradient(135deg, #dc2626, #b91c1c);
    box-shadow: 0 2px 8px rgba(220, 38, 38, 0.45);
  }
  .btn-top {
    background: rgba(30, 41, 59, 0.92);
    border: 1px solid rgba(148, 163, 184, 0.25);
    color: #f8fafc; text-decoration: none; display: inline-flex; align-items: center; gap: 5px;
  }
  body.embed header.topbar .btn-back { display: none; }
  body.embed #planGroup { display: none; }   /* 內嵌時方案跟著急救預案頁 */

  /* 右上角：生理監視器與圖例面板 */
  .side-hud {
    position: absolute; top: 78px; right: 14px; z-index: 15;
    width: 272px; display: flex; flex-direction: column; gap: 10px;
    pointer-events: none;
  }
  .monitor-card {
    background: rgba(10, 15, 28, 0.92);
    border: 2px solid #334155; border-radius: 14px;
    padding: 10px 12px; box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5);
  }
  .monitor-head {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12px; font-weight: 800; color: #94a3b8; margin-bottom: 6px;
  }
  .monitor-head .status-dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: #ef4444; box-shadow: 0 0 8px #ef4444; margin-right: 5px;
    animation: pulse 0.9s infinite alternate;
  }
  @keyframes pulse { from { opacity: 0.35; } to { opacity: 1; } }
  #ecgCanvas {
    width: 100%; height: 60px; background: #050811;
    border-radius: 8px; border: 1px solid #1e293b; display: block;
  }
  .vitals-row {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px;
  }
  .vital-box {
    background: rgba(15, 23, 42, 0.9); border-radius: 8px; padding: 4px 7px;
    border-left: 3px solid #22c55e;
  }
  .vital-box.spo2 { border-left-color: #38bdf8; }
  .vital-box.etco2 { border-left-color: #fbbf24; }
  .vital-box small { display: block; font-size: 10px; color: #94a3b8; font-weight: 700; }
  .vital-box strong { font-size: 15px; font-family: ui-monospace, SFMono-Regular, monospace; }

  .legend-card {
    background: var(--panel); backdrop-filter: blur(10px);
    border: 1px solid var(--panel-border); border-radius: 14px;
    padding: 10px 13px; font-size: 12.5px; line-height: 1.65;
  }
  .legend-card b { display: block; font-size: 13px; color: #fff; margin-bottom: 4px; }
  .legend-item { display: flex; align-items: center; gap: 8px; color: var(--sub); }
  .legend-dot { width: 11px; height: 11px; border-radius: 50%; flex: none; }

  /* 全院 999 廣播橫幅 */
  #broadcastBanner {
    position: absolute; top: 80px; left: 50%; transform: translateX(-50%);
    z-index: 25; background: linear-gradient(90deg, #991b1b, #dc2626, #991b1b);
    color: #fff; padding: 7px 22px; border-radius: 999px;
    font-size: 16px; font-weight: 800; letter-spacing: 0.5px;
    box-shadow: 0 8px 28px rgba(220, 38, 38, 0.65);
    border: 2px solid #fca5a5; display: none; align-items: center; gap: 10px;
    white-space: nowrap;
  }
  #broadcastBanner.show { display: inline-flex; animation: bannerPop 0.35s ease; }
  @keyframes bannerPop {
    from { transform: translateX(-50%) translateY(-12px) scale(0.9); opacity: 0; }
    to { transform: translateX(-50%) translateY(0) scale(1); opacity: 1; }
  }

  /* 底部：叫叫 CABD 進度與分步語音講解面板 */
  .bottom-dock {
    position: absolute; left: 14px; right: 14px; bottom: 14px; z-index: 20;
    max-width: 1150px; margin: 0 auto;
    background: var(--panel); backdrop-filter: blur(14px);
    border: 1px solid var(--panel-border);
    border-radius: 18px; padding: 12px 18px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
    display: flex; flex-direction: column; gap: 9px;
  }
  .cabd-track {
    display: flex; flex-wrap: wrap; align-items: center; gap: 5px;
  }
  .cabd-node {
    display: inline-flex; align-items: baseline; gap: 4px;
    padding: 4px 11px; border-radius: 9px;
    background: rgba(51, 65, 85, 0.78); color: #94a3b8;
    font-size: 15px; font-weight: 800; cursor: pointer;
    border: 1px solid transparent; transition: all 0.2s ease;
  }
  .cabd-node small { font-size: 11.5px; font-weight: 600; opacity: 0.9; }
  .cabd-node.done {
    background: rgba(22, 163, 74, 0.22); color: #4ade80;
    border-color: rgba(74, 222, 128, 0.4);
  }
  .cabd-node.done::after { content: ' ✓'; font-size: 12px; }
  .cabd-node.now {
    background: #dc2626; color: #fff;
    border-color: #fca5a5;
    box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.35);
    transform: translateY(-1px);
  }
  .cabd-arrow { color: #64748b; font-size: 13px; font-style: normal; }

  .caption-box {
    display: flex; align-items: center; gap: 12px;
    background: rgba(15, 23, 42, 0.95);
    border: 1px solid rgba(148, 163, 184, 0.2);
    border-radius: 13px; padding: 10px 15px; min-height: 58px;
  }
  .step-tag {
    background: var(--gold); color: #0f172a;
    font-weight: 900; font-size: 15px;
    padding: 5px 11px; border-radius: 8px; white-space: nowrap; flex: none;
  }
  .step-text {
    font-size: clamp(15px, 1.35vw, 20px); line-height: 1.52; color: #f8fafc; flex: 1;
  }
  .step-text b { color: #fde68a; font-weight: 800; }

  .ctl-row {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px;
  }
  .ctl-left, .ctl-right { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; }
  .btn-ctl {
    border: 1px solid rgba(148, 163, 184, 0.25);
    background: rgba(30, 41, 59, 0.95); color: #f8fafc;
    font: inherit; font-size: 14px; font-weight: 800;
    padding: 7px 14px; border-radius: 10px; cursor: pointer;
    transition: all 0.15s ease; display: inline-flex; align-items: center; gap: 5px;
  }
  .btn-ctl:hover:not(:disabled) { background: #334155; transform: translateY(-1px); }
  .btn-ctl:disabled { opacity: 0.4; cursor: default; }
  .btn-ctl.primary {
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    border-color: #60a5fa; color: #fff;
    box-shadow: 0 4px 14px rgba(37, 99, 235, 0.45);
  }
  .btn-ctl.primary:hover:not(:disabled) { background: linear-gradient(135deg, #3b82f6, #2563eb); }
  .btn-ctl.auto-on {
    background: linear-gradient(135deg, #059669, #047857);
    border-color: #34d399; color: #fff;
  }
  .step-counter {
    font-size: 14px; font-weight: 800; color: var(--sub); padding: 0 6px;
  }

  @media (max-width: 860px) {
    .side-hud { display: none; }
    header.topbar { padding: 7px 10px; gap: 5px; }
    .bottom-dock { padding: 9px 11px; bottom: 8px; left: 8px; right: 8px; }
    .btn-ctl { font-size: 12.5px; padding: 6px 10px; }
    .cabd-node { font-size: 12.5px; padding: 3px 7px; }
  }
</style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import {
  getSavedCharacterStyles,
  buildStandingCharacter,
  buildAnnieCharacter,
  tickCharacterAnimation
} from './characters3d.js';

// ── URL 參數與初始狀態 ───────────────────────────────────────
const qs = new URLSearchParams(location.search);
let plan = qs.get('plan') === '2' ? 2 : 1;
let curSceneId = ['s1', 's2', 's3a', 's3b'].includes(qs.get('scene')) ? qs.get('scene') : 's1';
const EMBED = qs.has('embed');
if (EMBED) {
  document.body.classList.add('embed');
  document.querySelectorAll('header.topbar a').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });   // 內嵌時另開分頁，不把 iframe 換掉
}

// ── Three.js 渲染器與高擬真環境設定 ─────────────────────────
const wrap = document.getElementById('canvas-wrap');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
wrap.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f172a);
scene.fog = new THREE.FogExp2(0x0f172a, 0.00036);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

const cam = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 5, 4500);
cam.position.set(490, 620, 920);

const controls = new OrbitControls(cam, renderer.domElement);
controls.target.set(490, 25, 320);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI / 2.05;
controls.minDistance = 110;
controls.maxDistance = 1800;
controls.update();

// ── 燈光系統 ─────────────────────────────────────────────────
scene.add(new THREE.HemisphereLight(0xf8fafc, 0x334155, 0.88));
const mainLight = new THREE.DirectionalLight(0xffffff, 1.65);
mainLight.position.set(220, 780, 680);
mainLight.target.position.set(520, 0, 320);
mainLight.castShadow = true;
mainLight.shadow.mapSize.set(2048, 2048);
Object.assign(mainLight.shadow.camera, { left: -520, right: 520, top: 450, bottom: -450, near: 100, far: 1800 });
mainLight.shadow.bias = -0.0005;
scene.add(mainLight, mainLight.target);

const roomLightA = new THREE.PointLight(0xf0f9ff, 1.15, 480, 0.5);
roomLightA.position.set(748, 180, 340);
const roomLightB = new THREE.PointLight(0xfff7ed, 1.15, 480, 0.5);
roomLightB.position.set(338, 180, 360);
scene.add(roomLightA, roomLightB);

// ── PBR 材質與醫療防滑地磚紋理 ───────────────────────────────
const matCache = {};
function pbr(color, rough = 0.45, metal = 0.08, extra = {}) {
  const key = `${color}_${rough}_${metal}_${JSON.stringify(extra)}`;
  if (!matCache[key]) {
    matCache[key] = new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: metal, ...extra });
  }
  return matCache[key];
}

function makeFloorTex(baseHex, gridHex) {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = baseHex;
  g.fillRect(0, 0, 256, 256);
  g.strokeStyle = gridHex;
  g.lineWidth = 2;
  g.strokeRect(0, 0, 256, 256);
  for (let i = 0; i < 90; i++) {
    g.fillStyle = i % 2 ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.04)';
    g.fillRect((i * 73) % 256, (i * 41) % 256, 3, 3);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(8, 8);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

const TEX_CT_FLOOR = makeFloorTex('#f3cba5', '#e2b58b');
const TEX_XR_FLOOR = makeFloorTex('#9dc4eb', '#84b0dc');
const TEX_WAIT_FLOOR = makeFloorTex('#c4e0b2', '#add099');
const TEX_HALL_FLOOR = makeFloorTex('#e2e8f0', '#cbd5e1');

const venueGroup = new THREE.Group();
const actorGroup = new THREE.Group();
const fxGroup = new THREE.Group();
scene.add(venueGroup, actorGroup, fxGroup);

function addBox(parent, x1, z1, x2, z2, y1, y2, material, shadow = true) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(x2 - x1, y2 - y1, z2 - z1), material);
  m.position.set((x1 + x2) / 2, (y1 + y2) / 2, (z1 + z2) / 2);
  m.castShadow = shadow;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}
function addCyl(parent, x, z, r, y1, y2, material, seg = 24) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, y2 - y1, seg), material);
  m.position.set(x, (y1 + y2) / 2, z);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

function makeSpriteLabel(text, { size = 24, bg = 'rgba(15,23,42,0.88)', fg = '#ffffff', border = null, scale = 0.14 } = {}) {
  const s = 3, cv = document.createElement('canvas'), g = cv.getContext('2d');
  const font = `800 ${size * s}px "PingFang TC","Heiti TC",sans-serif`;
  g.font = font;
  const lines = text.split('\n');
  const tw = Math.max(...lines.map(l => g.measureText(l).width));
  const pad = size * s * 0.52, lh = size * s * 1.28;
  cv.width = tw + pad * 2;
  cv.height = lh * lines.length + pad * 1.05;
  g.font = font;
  g.fillStyle = bg;
  g.beginPath();
  g.roundRect(0, 0, cv.width, cv.height, size * s * 0.36);
  g.fill();
  if (border) {
    g.lineWidth = s * 3.5;
    g.strokeStyle = border;
    g.stroke();
  }
  g.fillStyle = fg;
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  lines.forEach((l, i) => g.fillText(l, cv.width / 2, pad * 0.52 + lh * (i + 0.5)));
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false }));
  sp.scale.set(cv.width * scale / s, cv.height * scale / s, 1);
  sp.renderOrder = 20;
  return sp;
}

// ── 場景設備與建築建構 ───────────────────────────────────────
let dynamicObjs = {};

function buildHighRealismVenue(currentPlan) {
  venueGroup.clear();
  actorGroup.clear();
  fxGroup.clear();

function buildCTSuite(f, monPos, cartPos, roomCode) {
  const cx = (f.x1 + f.x2) / 2;
  const gantryZ = f.z2 - 30;

  // CT Gantry
  const gw = 96, gh = 84, gd = 26, r = 14;
  const s = new THREE.Shape();
  s.moveTo(-gw / 2 + r, 0);
  s.lineTo(gw / 2 - r, 0);
  s.quadraticCurveTo(gw / 2, 0, gw / 2, r);
  s.lineTo(gw / 2, gh - r);
  s.quadraticCurveTo(gw / 2, gh, gw / 2 - r, gh);
  s.lineTo(-gw / 2 + r, gh);
  s.quadraticCurveTo(-gw / 2, gh, -gw / 2, gh - r);
  s.lineTo(-gw / 2, r);
  s.quadraticCurveTo(-gw / 2, 0, -gw / 2 + r, 0);
  const hole = new THREE.Path();
  hole.absarc(0, 45, 24, 0, Math.PI * 2, true);
  s.holes.push(hole);

  const gantryGeo = new THREE.ExtrudeGeometry(s, { depth: gd, bevelEnabled: true, bevelSize: 2.5, bevelThickness: 2.5, curveSegments: 48 });
  const gantryMesh = new THREE.Mesh(gantryGeo, pbr(0xf8fafc, 0.22, 0.12));
  gantryMesh.position.set(cx, 0, gantryZ);

  const ivX = cx + 48, ivZ = f.z1 + 14;

  const g = new THREE.Group();
  // 四輪與不鏽鋼底架
  for (const [wx, wz] of [[-10, -26], [10, -26], [-10, 26], [10, 26]]) {

  }
  addBox(g, -12, -32, 12, 32, 24, 27, pbr(0xf8fafc, 0.3, 0.2));
  // 墨綠色推床軟墊＋เหลือง急救硬板（CPR board）

  return g;
}

function getRoomCoords(roomCode) {
  const f = roomCode === 'A' ? { x1: 706, z1: 356, x2: 788, z2: 453 } : { x1: 296, z1: 356, x2: 378, z2: 453 };

function triggerBroadcastWaves(originVec) {
  if (!originVec) return;
  for (let i = 0; i < 3; i++) {
    const ring = new THREE.Mesh(
      new THREE.RingGeometry(6, 10, 48),
      new THREE.MeshBasicMaterial({ color: 0xef4444, side: THREE.DoubleSide, transparent: true, opacity: 0.9 })
    );
    ring.rotation.x = -Math.PI / 2;
    ring.position.set(originVec.x, 34, originVec.z);
    fxGroup.add(ring);
    const t0 = performance.now() + i * 350;
    const animWave = now => {
      if (now < t0) { requestAnimationFrame(animWave); return; }
      const k = Math.min(1, (now - t0) / 1400);
      const s = 1 + k * 28;
      ring.scale.set(s, s, 1);
      ring.material.opacity = (1 - k) * 0.85;
      if (k < 1) requestAnimationFrame(animWave);
      else fxGroup.remove(ring);
    };
    requestAnimationFrame(animWave);
  }
}

// ── 補間動畫與移動工具 ───────────────────────────────────────
let stepToken = 0;
const easeInOut = k => k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;

function tween(ms, fn, myToken = stepToken) {
  return new Promise(res => {
    if (!ms || ms <= 0) { fn(1); return res(); }
    const t0 = performance.now();
    const tick = now => {
      if (myToken !== stepToken) return res();
      const k = Math.min(1, (now - t0) / ms);
      fn(easeInOut(k));
      if (k < 1) requestAnimationFrame(tick);
      else res();
    };
    requestAnimationFrame(tick);
  });
}

function setActorPos(actor, [x, z], lookAtXZ = null) {
  actor.position.set(x, 0, z);
  if (lookAtXZ) {
    const dx = lookAtXZ[0] - x, dz = lookAtXZ[1] - z;
    if (Math.hypot(dx, dz) > 0.5) actor.rotation.y = Math.atan2(dx, dz);
  }
}

async function moveActor3D(actor, toXZ, ms, lookAtEnd = null, tok = stepToken) {
  const fromX = actor.position.x, fromZ = actor.position.z;
  const dx = toXZ[0] - fromX, dz = toXZ[1] - fromZ;
  if (Math.hypot(dx, dz) > 1) actor.rotation.y = Math.atan2(dx, dz);
  actor.userData.pose = 'walk';
  await tween(ms, k => {
    actor.position.set(fromX + dx * k, 0, fromZ + dz * k);
  }, tok);
  actor.userData.pose = 'idle';
  if (lookAtEnd) {
    actor.rotation.y = Math.atan2(lookAtEnd[0] - toXZ[0], lookAtEnd[1] - toXZ[1]);
  }
}

function pointAlongPolyline(pts, k) {
  const segs = [];
  let total = 0;
  for (let i = 1; i < pts.length; i++) {
    const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    segs.push(d);
    total += d;
  }
  let t = k * total;
  for (let i = 0; i < segs.length; i++) {
    if (t <= segs[i] || i === segs.length - 1) {
      const f = segs[i] ? Math.min(1, t / segs[i]) : 1;
      const nx = pts[i][0] + (pts[i + 1][0] - pts[i][0]) * f;
      const nz = pts[i][1] + (pts[i + 1][1] - pts[i][1]) * f;
      const ang = Math.atan2(pts[i + 1][0] - pts[i][0], pts[i + 1][1] - pts[i][1]);
      return [nx, nz, ang];
    }
    t -= segs[i];
  }
  const last = pts[pts.length - 1];
  return [last[0], last[1], 0];
}

async function moveActorPath3D(actor, pts, ms, lookAtEnd = null, tok = stepToken) {
  const full = [[actor.position.x, actor.position.z], ...pts];
  actor.userData.pose = 'walk';
  await tween(ms, k => {
    const [nx, nz, ang] = pointAlongPolyline(full, k);
    actor.position.set(nx, 0, nz);
    actor.rotation.y = ang;
  }, tok);
  actor.userData.pose = 'idle';
  if (lookAtEnd) {
    const last = pts[pts.length - 1];
    actor.rotation.y = Math.atan2(lookAtEnd[0] - last[0], lookAtEnd[1] - last[1]);
  }
}

// 護理師推急救車跨區移動
async function pushCartAlongPath3D(rnActor, cartGroup, pts, endCartVec, endRnXZ, ms, tok = stepToken) {
  const fullCart = [[cartGroup.position.x, cartGroup.position.z], ...pts, [endCartVec.x, endCartVec.z]];
  rnActor.userData.pose = 'walk';
  await tween(ms, k => {
    const [cx, cz, ang] = pointAlongPolyline(fullCart, k);
    cartGroup.position.set(cx, 0, cz);
    cartGroup.rotation.y = ang;
    rnActor.position.set(cx - Math.sin(ang) * 18, 0, cz - Math.cos(ang) * 18);
    rnActor.rotation.y = ang;
  }, tok);
  cartGroup.rotation.y = 0;
  await moveActor3D(rnActor, endRnXZ, 550, [endCartVec.x, endCartVec.z + 20], tok);
}

// 兩人合力推等候區病床進入檢查室
async function pushStretcherPath3D(stretcher, actor1, actor2, pts, endA1, endA2, bedLook, ms, tok = stepToken) {
  const full = [[stretcher.position.x, stretcher.position.z], ...pts];
  actor1.userData.pose = 'walk';
  actor2.userData.pose = 'walk';
  await tween(ms, k => {
    const [sx, sz, ang] = pointAlongPolyline(full, k);
    stretcher.position.set(sx, 0, sz);
    actor1.position.set(sx + 18, 0, sz + 8);
    actor2.position.set(sx - 18, 0, sz - 18);
    actor1.rotation.y = ang;
    actor2.rotation.y = ang;
  }, tok);
  await Promise.all([
    moveActor3D(actor1, endA1, 500, bedLook, tok),
    moveActor3D(actor2, endA2, 500, bedLook, tok)
  ]);
}

// 動態建立下方步驟按鈕列
function renderCabdTrack() {
  const steps = SCENARIO_META[curSceneId].steps;
  const bar = document.getElementById('cabdBar');
  bar.innerHTML = steps.slice(1).map((st, idx) => {
    const sIdx = idx + 1;
    return `<span class="cabd-node" data-step="${sIdx}">${st.t}</span>`;
  }).join('<i class="cabd-arrow">→</i>');
  bar.querySelectorAll('.cabd-node').forEach(node => {
    node.onclick = () => playStep(Number(node.dataset.step));
  });
}

// ── 智慧攝影機運鏡 ───────────────────────────────────────────
let camMode = 'auto';
function flyCameraTo(pos, target, ms = 850) {
  const p0 = cam.position.clone(), t0 = controls.target.clone();
  const p1 = new THREE.Vector3(...pos), t1 = new THREE.Vector3(...target);
  tween(ms, k => {
    cam.position.lerpVectors(p0, p1, k);
    controls.target.lerpVectors(t0, t1, k);
    controls.update();
  }, stepToken);
}

function applyCameraForStep(stepIdx) {
  const CT = getRoomCoords(dynamicObjs.ctRoom);
  const XR = getRoomCoords(dynamicObjs.xrRoom);
  if (camMode === 'over') {
    flyCameraTo([520, 740, 820], [520, 10, 310], 700);
    return;
  }
  if (camMode === 'ct') {
    flyCameraTo([CT.cx + 15, 225, CT.f.z1 - 155], [CT.bedX, 28, CT.bedZ], 700);
    return;
  }
  if (camMode === 'xray') {
    flyCameraTo([XR.cx + 15, 225, XR.f.z1 - 155], [XR.bedX, 28, XR.bedZ], 700);
    return;
  }

  // auto 智慧跟拍
  if (stepIdx === 0) {
    flyCameraTo([520, 620, 790], [520, 20, 320], 800);
    return;
  }
  if (curSceneId === 's1') {
    if (stepIdx === 6) flyCameraTo([530, 560, 740], [530, 20, 310], 800);
    else flyCameraTo([CT.cx + 22, 215, CT.f.z1 - 150], [CT.bedX, 28, CT.bedZ], 800);
  } else if (curSceneId === 's2') {
    if (stepIdx === 5) flyCameraTo([530, 560, 740], [530, 20, 310], 800);
    else flyCameraTo([XR.cx + 22, 215, XR.f.z1 - 150], [XR.bedX, 28, XR.bedZ], 800);
  } else if (curSceneId === 's3a') {
    if (stepIdx <= 3) flyCameraTo([330, 230, 60], [315, 25, 225], 800);
    else if (stepIdx === 4 || stepIdx === 7) flyCameraTo([520, 560, 740], [520, 20, 310], 800);
    else flyCameraTo([CT.cx + 10, 225, CT.f.z1 - 155], [CT.bedX, 28, CT.bedZ], 800);
  } else if (curSceneId === 's3b') {
    if (stepIdx <= 3) flyCameraTo([330, 230, 60], [315, 25, 225], 800);
    else if (stepIdx === 4 || stepIdx === 5 || stepIdx === 7) flyCameraTo([520, 560, 740], [520, 20, 310], 800);
    else flyCameraTo([XR.cx + 10, 225, XR.f.z1 - 155], [XR.bedX, 28, XR.bedZ], 800);
  }
}

let curStep = 0;
let autoPlay = false;
let muted = false;
const voiceAudio = new Audio();
// 同一頁內嵌多個 3D 動畫時，只讓一個講話：這裡開始播語音，其他的就停下來
const voiceChannel = 'BroadcastChannel' in window ? new BroadcastChannel('er3d-voice') : null;
if (voiceChannel) voiceChannel.onmessage = () => {
  voiceAudio.pause();
  if (autoPlay) document.getElementById('btnAuto').click();
};

async function playStep(idx, { silent = false } = {}) {
  const meta = SCENARIO_META[curSceneId];
  const steps = meta.steps;
  curStep = Math.max(0, Math.min(steps.length - 1, idx));
  const myTok = ++stepToken;
  voiceAudio.pause();

  const st = steps[curStep];
  document.getElementById('sceneBadge').textContent = meta.badge;
  document.getElementById('sceneTitle').textContent = meta.title;
  document.getElementById('planSub').textContent =
    `方案${plan === 1 ? '一（A＝X 光／B＝CT）' : '二（A＝CT／B＝X 光）'}｜${meta.sub}`;
  document.getElementById('backLink').href = `emergency.html?plan=${plan}#${curSceneId}`;

  document.getElementById('stepTag').textContent = st.t;
  document.getElementById('stepCap').innerHTML = st.cap;
  document.getElementById('stepNo').textContent = curStep === 0 ? `開場／共 ${steps.length - 1} 步` : `第 ${curStep} 步／共 ${steps.length - 1} 步`;
  document.getElementById('btnPrev').disabled = curStep === 0;
  document.getElementById('btnNext').textContent = curStep === steps.length - 1 ? '↺ 重新開始' : '下一步 ▶';

  document.getElementById('rhythmTxt').textContent = st.rhythm;
  document.getElementById('hrVal').textContent = st.hr;
  document.getElementById('spo2Val').textContent = st.spo2;
  document.getElementById('defibVal').textContent = st.defib;

  document.querySelectorAll('#cabdBar .cabd-node').forEach(node => {
    const s = Number(node.dataset.step);
    node.className = 'cabd-node' + (s === curStep ? ' now' : s < curStep ? ' done' : '');
  });

  // 先對齊前一步結束的基底狀態
  applySnapshotState(curStep > 0 ? curStep - 1 : 0);
  applyCameraForStep(curStep);

  // 播放語音解說
  if (!silent) voiceAudio.src = st.audio;
  voiceAudio.currentTime = 0;
  voiceAudio.muted = muted;
  // 內嵌頁剛載入時先不講話，按「下一步」才開始
  const audioDone = silent ? Promise.resolve() : new Promise(resolve => {
    voiceAudio.onended = resolve;
    voiceAudio.onerror = resolve;
  });
  if (!silent) { voiceAudio.play().catch(() => {}); voiceChannel?.postMessage('play'); }

  const CT = getRoomCoords(dynamicObjs.ctRoom);
  const XR = getRoomCoords(dynamicObjs.xrRoom);

  // ── 依情境與步驟執行 3D 動作 ──
  if (curSceneId === 's1') {
    await runScenario1Step(curStep, CT, XR, myTok);
  } else if (curSceneId === 's2') {
    await runScenario2Step(curStep, CT, XR, myTok);
  } else if (curSceneId === 's3a') {
    await runScenario3aStep(curStep, CT, XR, myTok);
  } else if (curSceneId === 's3b') {
    await runScenario3bStep(curStep, CT, XR, myTok);
  }

  await audioDone;
  if (myTok === stepToken && autoPlay && curStep < steps.length - 1) {
    setTimeout(() => {
      if (myTok === stepToken && autoPlay) playStep(curStep + 1);
    }, 600);
  }
}

// ── 生理監視器即時心電圖 ──────────────────────────────────────
const ecgCv = document.getElementById('ecgCanvas');
const ecgCtx = ecgCv.getContext('2d');
let ecgX = 0;

function updateECGCanvas(now) {
  ecgCtx.fillStyle = 'rgba(5, 8, 17, 0.16)';
  ecgCtx.fillRect(0, 0, ecgCv.width, ecgCv.height);
  const midY = ecgCv.height / 2;
  let y = midY;
  if (actors.mk?.userData.cprActive) {
    const phase = (now * 0.0115) % (Math.PI * 2);
    y = midY - Math.sin(phase) * 17 - Math.sin(phase * 3) * 5;
  } else if (curStep >= 1 && curStep < 3) {
    y = midY + Math.sin(now * 0.035) * 12 + Math.cos(now * 0.082) * 9 + (Math.random() - 0.5) * 8;
  } else {
    y = midY + Math.sin(now * 0.02) * 3;
  }
  ecgCtx.strokeStyle = actors.mk?.userData.cprActive ? '#4ade80' : '#f87171';
  ecgCtx.lineWidth = 2.2;
  ecgCtx.beginPath();
  ecgCtx.moveTo(ecgX, updateECGCanvas.lastY ?? midY);
  ecgX = (ecgX + 2.2) % ecgCv.width;
  if (ecgX < 3) ecgCtx.clearRect(0, 0, ecgCv.width, ecgCv.height);
  ecgCtx.lineTo(ecgX, y);
  ecgCtx.stroke();
  updateECGCanvas.lastY = y;
}

// ── 主渲染迴圈 ───────────────────────────────────────────────
let onScreen = true;
if (EMBED && 'IntersectionObserver' in window) {
  new IntersectionObserver(([e]) => { onScreen = e.isIntersecting; }).observe(document.getElementById('canvas-wrap'));
}
function animateLoop(now) {
  requestAnimationFrame(animateLoop);
  if (!onScreen) return;
  controls.update();
  updateECGCanvas(now);

  for (const k of Object.keys(actors)) {
    tickCharacterAnimation(actors[k], now);
  }

  if (actors.mk?.userData.cprActive && cprPulseRing.visible) {
    const comp = Math.abs(Math.sin(now * 0.0115));
    const s = 1 + comp * 0.45;
    cprPulseRing.scale.set(s, s, 1);
    cprPulseRing.material.opacity = 0.85 - comp * 0.55;
  }

  renderer.render(scene, cam);
}

// ── UI 事件綁定 ──────────────────────────────────────────────
function rebuildAndStart(stepIdx = 0, opts) {
  document.querySelectorAll('#sceneGroup button').forEach(b => b.classList.toggle('on', b.dataset.scene === curSceneId));
  document.querySelectorAll('#planGroup button').forEach(b => b.classList.toggle('on', Number(b.dataset.plan) === plan));
  buildHighRealismVenue(plan);
  spawnActorsForScene();
  renderCabdTrack();
  playStep(stepIdx, opts);
}

document.getElementById('btnPrev').onclick = () => playStep(curStep - 1);
document.getElementById('btnNext').onclick = () => {
  const max = SCENARIO_META[curSceneId].steps.length - 1;
  if (curStep === max) playStep(0);
  else playStep(curStep + 1);
};
document.getElementById('btnReplay').onclick = () => playStep(curStep);

document.getElementById('btnAuto').onclick = e => {
  autoPlay = !autoPlay;
  e.currentTarget.textContent = `▶ 連續自動播放：${autoPlay ? '開' : '關'}`;
  e.currentTarget.classList.toggle('auto-on', autoPlay);
  if (autoPlay && voiceAudio.paused) {
    const max = SCENARIO_META[curSceneId].steps.length - 1;
    playStep(curStep < max ? curStep + 1 : 0);
  }
};

document.getElementById('btnMute').onclick = e => {
  muted = !muted;
  voiceAudio.muted = muted;
  e.currentTarget.textContent = muted ? '🔇 語音解說：靜音' : '🔊 語音解說：開';
};

document.querySelectorAll('#sceneGroup button').forEach(btn => {
  btn.onclick = () => {
    curSceneId = btn.dataset.scene;
    rebuildAndStart(0);
  };
});

document.querySelectorAll('#camGroup button').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('#camGroup button').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    camMode = btn.dataset.cam;
    applyCameraForStep(curStep);
  };
});

document.querySelectorAll('#planGroup button').forEach(btn => {
  btn.onclick = () => {
    plan = Number(btn.dataset.plan);
    rebuildAndStart(curStep);
  };
});

addEventListener('keydown', e => {
  const max = SCENARIO_META[curSceneId].steps.length - 1;
  if (e.key === 'ArrowRight') { e.preventDefault(); if (curStep < max) playStep(curStep + 1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); if (curStep > 0) playStep(curStep - 1); }
  else if (e.key === ' ') { e.preventDefault(); playStep(curStep); }
});

addEventListener('resize', () => {
  cam.aspect = innerWidth / innerHeight;
  cam.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

rebuildAndStart(0, { silent: EMBED });
requestAnimationFrame(animateLoop);
</script>
</body>
</html>
